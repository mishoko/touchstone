[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
skip = ["test/fixtures/**"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# The storage-layout snapshots (script/storage_layout.py) read this output; without it `forge inspect` forces a rebuild
# that also wipes the cache.
extra_output = ["storageLayout"]
# The golden-vector runners parse large JSON files inside the EVM; the default 2^30 test gas limit is too small.
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./eval/data" }, { access = "read-write", path = "./output/nonvacuity" }, { access = "read-write", path = "./output/e0" }, { access = "read-write", path = "./output/e0a" }, { access = "read-write", path = "./output/e0b" }]
# The size gate (runtime <= 22,000 B) is script/size_gate.py over `forge build --sizes --json` plus an anvil deploy.
# Note: `forge test` does not enforce EIP-170; the size gate is `forge build --sizes` + an anvil deploy (CI).

[profile.default.fuzz]
# A fixed seed keeps `forge test` and CI deterministic (a fuzz result never depends on the run). Explore new inputs with
# `script/explore.sh` (20,000 runs under a fresh random seed it prints; profiles inherit this seed, so the script
# overrides it) and pin every counterexample as a unit test.
seed = "0x5309"

[profile.explore.fuzz]
runs = 20000

[profile.default.invariant]
# 64 x 64 for the edit-test loop (the fixed seed replays the same calls: a regression check, not exploration). The
# 256 x 128 campaign with the non-vacuity check runs in script/ci-local.sh before each review freeze and at close;
# exploration under fresh seeds goes through script/explore.sh.
runs = 64
depth = 64
fail_on_revert = false

[lint]
# Field names of the parameter structs follow the specification's parameter names.
lint_on_build = false

[profile.invariant.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.mutation]
fuzz = { runs = 64 }
invariant = { runs = 16, depth = 32 }

[profile.fork]
# fork tests read UNICHAIN_SEPOLIA_RPC_URL / MAINNET_RPC_URL from the environment

[profile.oversized]
# Builds only the size-gate fixture (expected to be rejected by script/size_gate.py).
src = "test/fixtures"
test = "test/fixtures"
script = "test/fixtures"
skip = []
out = "out-oversized"
cache_path = "cache-oversized"
